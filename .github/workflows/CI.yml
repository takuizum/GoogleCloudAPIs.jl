name: CI

on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────
  # 1. 静的解析・コード品質チェック（高速・エミュレータ不要）
  # ──────────────────────────────────────────────
  lint:
    name: Aqua Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2

      - name: Run Aqua.jl on all packages
        run: |
          julia --project=. -e '
            using Pkg
            Pkg.develop([
              PackageSpec(path="GoogleAuth.jl"),
              PackageSpec(path="GoogleApiCore.jl"),
              PackageSpec(path="GoogleCloudStorage.jl"),
              PackageSpec(path="GoogleBigQuery.jl"),
              PackageSpec(path="GoogleCloudPubSub.jl"),
            ])
            Pkg.add("Aqua")
            Pkg.instantiate()

            using Aqua
            using GoogleAuth, GoogleApiCore, GoogleCloudStorage, GoogleBigQuery, GoogleCloudPubSub

            @info "Testing GoogleAuth..."
            Aqua.test_all(GoogleAuth; ambiguities=false, persistent_tasks=false)
            @info "Testing GoogleApiCore..."
            Aqua.test_all(GoogleApiCore; ambiguities=false, persistent_tasks=false)
            @info "Testing GoogleCloudStorage..."
            Aqua.test_all(GoogleCloudStorage; ambiguities=false, persistent_tasks=false)
            @info "Testing GoogleBigQuery..."
            Aqua.test_all(GoogleBigQuery; ambiguities=false, persistent_tasks=false)
            @info "Testing GoogleCloudPubSub..."
            Aqua.test_all(GoogleCloudPubSub; ambiguities=false, persistent_tasks=false)
          '

  # ──────────────────────────────────────────────
  # 2. パッケージ別・Juliaバージョン別の並列テスト
  # ──────────────────────────────────────────────
  test:
    needs: lint
    name: Test ${{ matrix.package }} - Julia ${{ matrix.julia-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1.11', '1.12']
        package:
          - GoogleAuth
          - GoogleApiCore
          - GoogleCloudStorage
          - GoogleBigQuery
          - GoogleCloudPubSub

    env:
      JULIA_NUM_THREADS: auto
      # Tell each package's test runner to skip the docker-spawn branch and
      # use the emulators we start at the job level.
      PUBSUB_EMULATOR_HOST: "localhost:8085"
      STORAGE_EMULATOR_HOST: "http://localhost:4443"
      BIGQUERY_EMULATOR_HOST: "http://localhost:9050"

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@v2

      # ──────────────────────────────────────────────
      # エミュレータを起動して接続可能になるまで待機
      # ──────────────────────────────────────────────
      - name: Start GCP Emulators
        if: matrix.package == 'GoogleCloudStorage' || matrix.package == 'GoogleBigQuery' || matrix.package == 'GoogleCloudPubSub'
        run: |
          docker compose up -d
          echo "Waiting for emulators to become ready..."

          # Pub/Sub: '/' は 405 を返すので nc でポート疎通だけ確認
          ready=0
          for i in $(seq 1 30); do
            if nc -z localhost 8085; then
              echo "Pub/Sub emulator is listening."
              ready=1; break
            fi
            echo "  pubsub attempt $i/30 ..."
            sleep 2
          done
          [ $ready -eq 1 ] || { echo "::error::Pub/Sub emulator failed to start"; docker compose logs pubsub-emulator; exit 1; }

          # GCS: discovery-like endpoint should give 200 with project param
          ready=0
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" "http://localhost:4443/storage/v1/b?project=test-project" | grep -q "^2"; then
              echo "GCS emulator is ready."
              ready=1; break
            fi
            echo "  gcs attempt $i/30 ..."
            sleep 2
          done
          [ $ready -eq 1 ] || { echo "::error::GCS emulator failed to start"; docker compose logs gcs-emulator; exit 1; }

          # BigQuery: discovery doc is unauthenticated and returns 200
          ready=0
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" "http://localhost:9050/discovery/v1/apis/bigquery/v2/rest" | grep -q "^2"; then
              echo "BigQuery emulator is ready."
              ready=1; break
            fi
            echo "  bq attempt $i/30 ..."
            sleep 2
          done
          [ $ready -eq 1 ] || { echo "::error::BigQuery emulator failed to start"; docker compose logs bigquery-emulator; exit 1; }

          docker compose ps

      # ──────────────────────────────────────────────
      # テスト実行 — 各サブパッケージを単独で develop して test
      # ──────────────────────────────────────────────
      - name: Run ${{ matrix.package }} Tests
        run: |
          julia --project=. -e '
            using Pkg
            # Develop all sibling packages so inter-package UUIDs resolve locally
            # (root Project.toml lists each one as a [deps] entry by UUID).
            Pkg.develop([
              PackageSpec(path="GoogleAuth.jl"),
              PackageSpec(path="GoogleApiCore.jl"),
              PackageSpec(path="GoogleCloudStorage.jl"),
              PackageSpec(path="GoogleBigQuery.jl"),
              PackageSpec(path="GoogleCloudPubSub.jl"),
            ])
            Pkg.instantiate()
            Pkg.test("${{ matrix.package }}")
          '

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # 失敗時のデバッグ用ログ出力
      - name: Dump Emulator Logs
        if: failure() && (matrix.package == 'GoogleCloudStorage' || matrix.package == 'GoogleBigQuery' || matrix.package == 'GoogleCloudPubSub')
        run: docker compose logs --tail=200

      - name: Stop Emulators
        if: always() && (matrix.package == 'GoogleCloudStorage' || matrix.package == 'GoogleBigQuery' || matrix.package == 'GoogleCloudPubSub')
        run: docker compose down --volumes --remove-orphans
