name: CompatHelper

on:
  schedule:
    - cron: '00 00 * * *'
  workflow_dispatch:

jobs:
  CompatHelper:
    runs-on: ubuntu-latest
    steps:
      - name: Pkg.add("CompatHelper")
        run: julia -e 'using Pkg; Pkg.add("CompatHelper")'

      - name: Run CompatHelper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          julia -e '
            using CompatHelper
            CompatHelper.main(
              subdirs = [
                "GoogleAuth.jl",
                "GoogleApiCore.jl",
                "GoogleCloudStorage.jl",
                "BigQuery.jl",
                "GoogleCloudPubSub.jl",
                "docs",
              ]
            )
          '
